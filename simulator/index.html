<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Slots — Simulator</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>"
    />
  </head>
  <body class="simulator">
    <!-- Hidden game DOM the headless AutoGame drives (src/sim/harness.js). -->
    <div
      class="game"
      style="
        position: absolute;
        left: -9999px;
        top: -9999px;
        pointer-events: none;
      "
    >
      <div class="container">
        <div class="ui"></div>
        <div class="inventory"></div>
        <div class="event-log">
          <div class="event-log-inner"></div>
        </div>
        <div class="game-layout">
          <div class="wrapper board-column">
            <div class="grid-scaler">
              <div class="grid-scaler-content">
                <div id="grid" class="grid"></div>
                <div class="grid-overlay"></div>
              </div>
            </div>
            <div class="progression-bar hidden"></div>
          </div>
          <div class="shop-wrapper">
            <div class="info"></div>
            <div class="shop hidden"></div>
          </div>
        </div>
        <div class="wrapper">
          <div class="settings"></div>
        </div>
      </div>
    </div>

    <div class="sim-page">
      <header class="sim-header">
        <h1>🎰 Emoji Slots Simulator</h1>
        <a href="/index.html" class="sim-back-link">← Back to Game</a>
      </header>

      <div class="sim-layout">
        <!-- Strategy Config -->
        <section class="sim-strategy">
          <div class="sim-category" data-category="shopping">
            <div class="sim-category-header">
              <h3>Shopping</h3>
              <span class="sim-category-role">acquisition</span>
            </div>
            <div class="sim-slot-cols">
              <div class="sim-slot-col">
                <div class="sim-slot-col-header">Always</div>
                <div
                  class="sim-slot-chips"
                  data-category="shopping"
                  data-mode="always"
                ></div>
                <button
                  type="button"
                  class="sim-btn sim-add-btn"
                  data-category="shopping"
                  data-mode="always"
                >
                  + Add
                </button>
              </div>
              <div class="sim-slot-col">
                <div class="sim-slot-col-header">Repeat</div>
                <div
                  class="sim-slot-chips"
                  data-category="shopping"
                  data-mode="repeat"
                ></div>
                <button
                  type="button"
                  class="sim-btn sim-add-btn"
                  data-category="shopping"
                  data-mode="repeat"
                >
                  + Add
                </button>
              </div>
            </div>
          </div>

          <div class="sim-category" data-category="eye">
            <div class="sim-category-header">
              <h3>Eye <span class="sim-category-emoji">🧿</span></h3>
              <span class="sim-category-role">targeting</span>
            </div>
            <div class="sim-slot-cols">
              <div class="sim-slot-col">
                <div class="sim-slot-col-header">Always</div>
                <div
                  class="sim-slot-chips"
                  data-category="eye"
                  data-mode="always"
                ></div>
                <button
                  type="button"
                  class="sim-btn sim-add-btn"
                  data-category="eye"
                  data-mode="always"
                >
                  + Add
                </button>
              </div>
              <div class="sim-slot-col">
                <div class="sim-slot-col-header">Repeat</div>
                <div
                  class="sim-slot-chips"
                  data-category="eye"
                  data-mode="repeat"
                ></div>
                <button
                  type="button"
                  class="sim-btn sim-add-btn"
                  data-category="eye"
                  data-mode="repeat"
                >
                  + Add
                </button>
              </div>
            </div>
          </div>

          <div class="sim-category" data-category="axe">
            <div class="sim-category-header">
              <h3>Axe <span class="sim-category-emoji">🪓</span></h3>
              <span class="sim-category-role">targeting</span>
            </div>
            <div class="sim-slot-cols">
              <div class="sim-slot-col">
                <div class="sim-slot-col-header">Always</div>
                <div
                  class="sim-slot-chips"
                  data-category="axe"
                  data-mode="always"
                ></div>
                <button
                  type="button"
                  class="sim-btn sim-add-btn"
                  data-category="axe"
                  data-mode="always"
                >
                  + Add
                </button>
              </div>
              <div class="sim-slot-col">
                <div class="sim-slot-col-header">Repeat</div>
                <div
                  class="sim-slot-chips"
                  data-category="axe"
                  data-mode="repeat"
                ></div>
                <button
                  type="button"
                  class="sim-btn sim-add-btn"
                  data-category="axe"
                  data-mode="repeat"
                >
                  + Add
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Emoji picker overlay, opened by a slot's "+ Add" button -->
        <div class="sim-picker-overlay hidden" id="sim-picker-overlay">
          <div class="sim-picker-panel">
            <div class="sim-picker-panel-header">
              <span id="sim-picker-title"></span>
              <button
                type="button"
                class="sim-picker-close"
                id="sim-picker-close"
                aria-label="Close"
              >
                ✕
              </button>
            </div>
            <div class="sim-picker-tiles" id="sim-picker-tiles"></div>
          </div>
        </div>

        <!-- Progression Mode -->
        <section class="sim-progression">
          <label class="sim-progression-toggle">
            <input type="checkbox" id="sim-progression-mode" />
            Progression mode
          </label>
          <div
            class="sim-progression-bags hidden"
            id="sim-progression-bags"
          ></div>
        </section>

        <!-- Controls -->
        <section class="sim-controls">
          <label>
            Rounds:
            <input
              type="number"
              id="sim-rounds"
              value="100"
              min="1"
              max="10000"
            />
          </label>
          <label>
            Refresh for this many turns:
            <input
              type="number"
              id="sim-refresh-turns"
              value="30"
              min="0"
              max="50"
            />
          </label>
          <button id="sim-start" class="sim-btn sim-btn-primary">
            Simulate
          </button>
          <button id="sim-stop" class="sim-btn" disabled>Stop</button>
          <span id="sim-progress"></span>
        </section>

        <!-- Stats -->
        <section class="sim-stats" id="sim-stats">
          <div class="sim-stat">
            <span class="sim-stat-label">Avg</span
            ><span class="sim-stat-value" id="stat-avg">—</span>
          </div>
          <div class="sim-stat">
            <span class="sim-stat-label">Min</span
            ><span class="sim-stat-value" id="stat-min">—</span>
          </div>
          <div class="sim-stat">
            <span class="sim-stat-label">Max</span
            ><span class="sim-stat-value" id="stat-max">—</span>
          </div>
          <div class="sim-stat">
            <span class="sim-stat-label">Median</span
            ><span class="sim-stat-value" id="stat-median">—</span>
          </div>
          <div class="sim-stat-trophies" id="stat-trophies"></div>
        </section>

        <!-- Results Table -->
        <section class="sim-results">
          <table class="sim-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Score</th>
                <th></th>
                <th>Inventory</th>
                <th>Passives</th>
              </tr>
            </thead>
            <tbody id="sim-results-body"></tbody>
          </table>
        </section>
      </div>
    </div>

    <script type="module" src="/simulator.js"></script>
  </body>
</html>
